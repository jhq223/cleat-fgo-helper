[package]
name = "cleat-fgo-helper"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "fgo-helper"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
simple-rijndael = "0.3"
flate2 = "1.0"
bzip2 = "0.4"
base64 = "0.22"
sha1 = "0.10"
md-5 = "0.10"
rayon = "1.10"
csv = "1.3"
log = "0.4"
env_logger = "0.11"
anyhow = "1"
thiserror = "2"
hex = "0.4"
rmp-serde = "1.3"
regex = "1"
futures-util = "0.3"
unity-asset = { git = "https://github.com/Latias94/unity-asset" }
zip = "2"
walkdir = "2"
urlencoding = "2"
peg = "0.8"
